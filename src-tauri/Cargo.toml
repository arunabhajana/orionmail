[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
wincredentials = "0.1.1"
zeroize = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
window-vibrancy = "0.7.1"
oauth2 = { version = "4.4.2", features = ["reqwest"] }
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7.13"
chrono = "0.4.43"
open = "5.3.3"
dotenvy = "0.15.7"
url = "2.5.8"
imap = "2.4.1"
native-tls = { version = "0.2.12", features = ["vendored"] }
base64 = "0.22.1"
mailparse = "0.16.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
once_cell = "1.21.3"
regex = "1.12.3"
kuchikiki = "=0.8.8-speedreader"
futures = "0.3"
imap-proto = "0.10.2"
dashmap = "6.1.0"
itoa = "1.0.17"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }
anyhow = "1.0"
mime = "0.3"
uuid = { version = "1.0", features = ["v4"] }
email_address = "0.2.9"
mime_guess = "2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Data_Xml_Dom",
    "Foundation_Collections",
    "UI_Notifications",
    "Security_Credentials_UI",
    "Foundation",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
]

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-core = "0.58"
webview2-com = "=0.38.2"
windows-core-webview = { package = "windows-core", version = "0.61" }

[patch.crates-io]
imap = { path = "vendor/imap" }

# Keep local builds within a modest disk budget. Retain app line information
# and debug checks, but avoid large dependency PDBs and incremental snapshots.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

# Keep CPU-intensive mail matching optimized during `tauri dev` as well.
[profile.dev.package.regex]
opt-level = 2
debug = 0

[profile.dev.package.regex-automata]
opt-level = 2
debug = 0

[profile.dev.package.regex-syntax]
opt-level = 2
debug = 0
