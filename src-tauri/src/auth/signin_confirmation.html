<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>{{TITLE}} · OrionMail</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#edf0f6;background:#101116;color-scheme:dark;--muted:#a8acb8;--line:#ffffff12;--card:#191b22;--accent:#277bf1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 10% 0%,#277bf11c,transparent 55%),radial-gradient(ellipse at 100% 100%,#a970ff12,transparent 50%)}main{width:100%;max-width:540px}.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-size:23px;font-weight:650;margin-bottom:30px}.brand svg{width:44px;height:38px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:36px;box-shadow:0 24px 80px #0003}.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#88b8ff;border:1px solid #277bf133;background:#277bf112;padding:7px 11px;border-radius:24px}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}h1{font-size:27px;line-height:1.25;letter-spacing:-.7px;margin:20px 0 12px}p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 22px}.button{display:flex;justify-content:center;align-items:center;gap:10px;min-height:46px;padding:12px 20px;background:var(--accent);color:white;text-decoration:none;font-size:14px;font-weight:600;border-radius:11px;transition:background .15s}.button:hover{background:#1969da}.button:focus-visible,summary:focus-visible{outline:3px solid #88b8ff;outline-offset:4px}.hint{font-size:12px;margin:12px 0 0;text-align:center}details{border-top:1px solid var(--line);margin-top:26px;padding-top:20px}summary{font-size:13px;cursor:pointer;color:var(--muted)}details p{font-size:13px;margin:12px 0 0}footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;padding:22px 12px}@media(max-width:480px){.card{padding:26px 22px}h1{font-size:24px}}@media(prefers-color-scheme:light){:root{color:#18202e;background:#f6f7f8;color-scheme:light;--muted:#606878;--line:#00000012;--card:#ffffff;}.status{color:#1765ce}.brand svg rect{fill:#303644}}
</style></head><body><main><div class="brand">{{LOGO}}<span>OrionMail</span></div><section class="card" aria-labelledby="title"><span class="status">{{STATUS}}</span><h1 id="title">{{TITLE}}</h1><p>{{MESSAGE}}</p>{{ACTION}}<p class="hint">{{HINT}}</p><details><summary>Need a hand?</summary><p>{{HELP}}</p></details></section><footer>You can safely close this browser tab.<br>Your mailbox and connection status are available in OrionMail.</footer></main></body></html>
