name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Validate tag and release
        run: node scripts/distribute.mjs validate
      - name: Prepare updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/distribute.mjs config
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          node scripts/release.mjs render
          if ($LASTEXITCODE) { throw 'Release notes validation failed.' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release view $env:GITHUB_REF_NAME --json isDraft > $env:RUNNER_TEMP/existing-release.json 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(Get-Content $env:RUNNER_TEMP/existing-release.json | ConvertFrom-Json).isDraft) { throw 'Published releases cannot be overwritten.' }
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "OrionMail $version" --notes-file ".release-output/$version.md"
            if ($LASTEXITCODE) { throw 'Could not create draft release.' }
          }
          # The REST tag endpoint can return 404 for drafts. The release command
          # also searches authenticated draft releases and exposes their numeric ID.
          $id = gh release view $env:GITHUB_REF_NAME --json databaseId --jq .databaseId
          if ($LASTEXITCODE -ne 0 -or $id -notmatch '^\d+$') { throw 'Draft release ID not found.' }
          "id=$id" >> $env:GITHUB_OUTPUT
      - uses: tauri-apps/tauri-action@v0
        with:
          releaseId: ${{ steps.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          tauriScript: npm run tauri
          args: --config .release-output/tauri.release.json --bundles nsis
          updaterJsonPreferNsis: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - name: Verify updater artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if (!$installers.Count) { throw 'Missing Windows installer.' }
          foreach ($installer in $installers) {
            if (!(Test-Path ($installer.FullName + '.sig'))) { throw 'Missing updater signature.' }
          }
          gh release download $env:GITHUB_REF_NAME --pattern latest.json --dir .release-output --clobber
          if ($LASTEXITCODE) { throw 'Missing updater manifest.' }
          node scripts/distribute.mjs manifest .release-output/latest.json
          if ($LASTEXITCODE) { throw 'Invalid updater manifest.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
